<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonoy Smith - Contact</title>
    <style>
        /* Base Setup & Background (Same as homepage) */
        * { box-sizing: border-box; }
        
		html {
    overflow-y: scroll;
}
		
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #3b82f6; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Abstract Background Elements */
        .shape-top-left {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            border-top: 140px solid rgba(255, 255, 255, 0.3); border-right: 140px solid transparent; z-index: 1;
        }
        .shape-top-right {
            position: absolute; top: 0; right: 0; width: 0; height: 0;
            border-top: 100px solid rgba(255, 255, 255, 0.3); border-left: 100px solid transparent; z-index: 1;
        }
        .shape-mid-left {
            position: absolute; right: 50%; top: 0%; width: 60px; height: 60px;
            background-color: rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 1;
        }
        .shape-mid-right {
            position: absolute; right: 0; top: 35%; width: 0; height: 0;
            border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-right: 45px solid rgba(255, 255, 255, 0.3); z-index: 1;
        }

        /* Main White Card Container */
        .portfolio-container {
            width: 98%;
            max-width: 1330px;
            background-color: #ffffff;
            border-radius: 36px;
            padding: 50px 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 2;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-avatar {
            background-color: #111827; color: #ffffff; width: 52px; height: 52px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 20px; letter-spacing: -0.5px;
        }

        .logo-name { font-size: 16px; font-weight: 700; color: #111827; }
        .logo-name span { font-weight: 400; color: #4b5563; }

        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; }

        /* Menu Tabs with Drop Shadows */
        nav a {
			text-decoration: none;
			color: #1f2937;
			background-color: #e0ecfb;
			padding: 8px 16px; /* Uniform horizontal padding */
			border-radius: 20px;
			font-size: 14px;
			font-weight: 500;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
			transition: all 0.2s ease;
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}

        nav a:hover {
            background-color: #cbdcf7;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
            transform: translateY(-1px);
        }
		
		/* Construction Badge Badge Pill */
        .construction-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            line-height: 1;
        }

        .construction-badge svg {
            width: 11px;
            height: 11px;
            stroke: #b45309;
        }

        /* Resume Section Styling */
        .section-header {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .section-header::after {
            content: '';
            position: absolute; left: 0; bottom: -6px; width: 48px; height: 3px;
            background-color: #3b82f6; border-radius: 2px;
			border-radius: 2px;
			animation: slideLine 3s ease-in-out infinite;
        }
		
		@keyframes slideLine {
			0% {
				left: 0;
			}
			50% {
				left: calc(100% - 48px);
			}
			100% {
				left: 0; /* Returns back to the left */
			}
		}

        /* PDF Viewer Container */
        .pdf-wrapper {
            width: 100%;
            height: 75vh; /* Takes up 75% of the viewport height */
            min-height: 600px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f9fafb;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .portfolio-container { padding: 30px 20px; }
            header { flex-direction: column; gap: 20px; margin-bottom: 30px; }
            nav ul { flex-wrap: wrap; justify-content: center; }
            .pdf-wrapper { height: 60vh; min-height: 400px; }
        }
		
		/* Contact Section */
			.contact-section {
				margin-top: 60px;
			}

			.contact-form {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 20px;
				margin-top: 10px;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}

			.full-width {
				grid-column: 1 / -1;
			}

			.checkbox-group {
				flex-direction: row;
				align-items: center;
				grid-column: 1 / -1;
				gap: 10px;
				margin-top: 8px;
			}

			.checkbox-label {
				font-weight: 500;
				cursor: pointer;
			}

			.contact-form label {
				font-size: 13px;
				font-weight: 700;
				color: #374151;
			}

			.contact-form input[type="text"],
			.contact-form input[type="email"],
			.contact-form textarea {
				padding: 12px 16px;
				border: 1.5px solid #e5e7eb;
				border-radius: 12px;
				font-size: 14px;
				font-family: inherit;
				color: #111827;
				background-color: #ffffff;
				transition: all 0.2s ease;
			}

			/* Focus States for Accessibility and UI Polish */
			.contact-form input:focus,
			.contact-form textarea:focus {
				outline: none;
				border-color: #3b82f6;
				box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
			}

			/* Disabled State for Company Field */
			.contact-form input:disabled {
				background-color: #f3f4f6;
				color: #9ca3af;
				cursor: not-allowed;
				border-color: #e5e7eb;
				opacity: 0.7;
			}

			/* Custom Submit Button with Hover Effects */
			.submit-btn {
				background-color: #3b82f6;
				color: #ffffff;
				padding: 14px 32px;
				border: none;
				border-radius: 20px;
				font-size: 14px;
				font-weight: 700;
				cursor: pointer;
				box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
				transition: all 0.2s ease;
				grid-column: 1 / -1;
				justify-self: start;
				margin-top: 10px;
			}

			.submit-btn:hover {
				background-color: #2563eb;
				box-shadow: 0 6px 14px rgba(59, 130, 246, 0.4);
				transform: translateY(-2px);
			}

		/* Mobile Responsiveness for Form */
		@media (max-width: 768px) {
			.contact-form {
				grid-template-columns: 1fr;
			}
			.submit-btn {
				justify-self: stretch;
				width: 100%;
			}
		}
    </style>
</head>
<body>

    <!-- Outer Decorative Background Shapes -->
    <div class="shape-top-left"></div>
    <div class="shape-top-right"></div>
    <div class="shape-mid-left"></div>
    <div class="shape-mid-right"></div>

    <!-- Main Container Card -->
    <div class="portfolio-container">

        <!-- Navigation Header -->
        <header>
            <div class="logo-container">
                <div class="logo-avatar">JS</div>
                <div class="logo-name">Jonoy <span>Smith</span></div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="portfolio.html">
							Portfolio
							<span class="construction-badge">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
									<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
								</svg>
								Soon
							</span>
						</a>
					</li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Resume Content Section -->
        <section class="contact-section" id="contact">
    <h2 class="section-header">Let's Get In Touch</h2>
    
    <form class="contact-form" id="contactForm">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="hasCompany" name="hasCompany">
            <label for="hasCompany" class="checkbox-label">I am reaching out on behalf of a company</label>
        </div>

        <div class="form-group">
            <label for="company">Your Company</label>
            <input type="text" id="company" name="company" placeholder="Company Name" disabled>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What is this regarding?" required>
        </div>

        <div class="form-group full-width">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</section>

<script>
// Contact Form Logic
const companyCheckbox = document.getElementById('hasCompany');
const companyInput = document.getElementById('company');

companyCheckbox.addEventListener('change', function() {
    if (this.checked) {
        // Enable the field and immediately bring the user's cursor to it
        companyInput.disabled = false;
        companyInput.focus();
    } else {
        // Disable the field and clear out any text they might have typed
        companyInput.disabled = true;
        companyInput.value = '';
    }
});

// Optional: Prevent default form submission so the page doesn't reload when clicked
const contactForm = document.getElementById('contactForm');
contactForm.addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Form submitted! (You will need to connect this to a backend service like Formspree or EmailJS to actually receive emails).");
});
</script>

</body>
</html>
